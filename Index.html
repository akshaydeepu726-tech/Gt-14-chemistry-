
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GT 14 - Chemistry Challenge</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #101827;
  color: white;
  text-align: center;
  padding: 20px;
}
.container {
  max-width: 650px;
  margin: auto;
  background: #1e293b;
  padding: 24px;
  border-radius: 16px;
}
h1 { color: #38bdf8; }
input, button {
  padding: 13px;
  margin: 8px;
  border-radius: 8px;
  border: none;
}
input { width: 80%; }
button {
  background: #0284c7;
  color: white;
  cursor: pointer;
}
</style>
</head>
<body>
<div class="container">
<h1>GT 14</h1>
<h2>JEE Chemistry Challenge</h2>
<p>25 Questions | 100 Marks | 60 Minutes</p>
<input id="student" placeholder="Enter your name">
<br>
<button onclick="startExam()">Start Examination</button>
<div id="exam"></div>
</div>
<script>
function startExam() {
 const name = document.getElementById("student").value.trim();
 if(!name) {
   alert("Enter your name first!");
   return;
 }
 document.getElementById("exam").innerHTML =
 "<h2>Welcome, "+name.replace(/[&<>"']/g,"")+"!</h2><p>Your GT 14 examination will begin soon.</p>";
}
</script>
</body>
  </html>
